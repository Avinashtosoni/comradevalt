<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A private command center for projects and your digital ecosystem.">
  <meta name="theme-color" content="#0d0f17">
  <meta name="color-scheme" content="dark light">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Comrade Vault">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Comrade Vault — Digital command center</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0d0f17; }
    #app-loading { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(circle at 50% 42%, #1b1a31 0, #0d0f17 46%); color: #f0f1f8; font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; transition: opacity .3s ease; }
    #app-loading.done { opacity: 0; pointer-events: none; }
    .splash { display: grid; justify-items: center; gap: 17px; }
    .mark { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; color: white; font-size: 24px; font-weight: 800; background: linear-gradient(140deg, #ae96ff, #7156dc); box-shadow: 0 12px 40px #8567fa44; }
    .loader { width: 110px; height: 2px; overflow: hidden; border-radius: 4px; background: #25283a; }
    .loader::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #947bff, #53d9d0); animation: loading 1.2s ease-in-out infinite; }
    @keyframes loading { from { transform: translateX(-120%); } to { transform: translateX(260%); } }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('app-loading');
      if (loading) { loading.classList.add('done'); window.setTimeout(function () { loading.remove(); }, 350); }
    });
  </script>
</head>
<body>
  <div id="app-loading"><div class="splash"><div class="mark">✦</div><div>Preparing your workspace…</div><div class="loader"></div></div></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
